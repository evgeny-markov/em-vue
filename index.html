    <meta name="description" content="Евгений Марков — frontend-разработчик Vue.js, Nuxt, TypeScript. 6+ лет коммерческого опыта." />
    <title>Евгений Марков — Frontend-разработчик</title>
    <style>
      html.is-locked {
        overflow: hidden;
      }

      html.is-locked body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        width: 100%;
      }
    </style>
    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);
      document.documentElement.classList.add("is-locked");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />

  </body>
